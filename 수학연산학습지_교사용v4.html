<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수학 연산 학습 — 교사용 대시보드</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#2563EB;--blue-lt:#EFF6FF;--blue-bd:#BFDBFE;
  --green:#16A34A;--green-lt:#F0FDF4;--green-bd:#BBF7D0;
  --red:#DC2626;--red-lt:#FEF2F2;--red-bd:#FECACA;
  --amber:#D97706;--amber-lt:#FFFBEB;--amber-bd:#FDE68A;hh
  --gray:#6B7280;--gray-lt:#F9FAFB;--gray-bd:#E5E7EB;hh
  --text:#111827;--text2:#6B7280;--text3:#9CA3AF;
  --bg:#F3F4F6;--card:#FFFFFF;--radius:12px;--rsm:8px;
}
body{font-family:'Noto Sans KR',system-ui,sans-serif;background:var(--bg);min-height:100vh}

/* 로그인 */
#loginOverlay{position:fixed;inset:0;background:rgba(17,24,39,.65);display:flex;align-items:center;justify-content:center;z-index:100}
.lc{background:var(--card);border-radius:20px;padding:2.5rem 2rem;width:min(340px,92vw);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.lc-icon{font-size:48px;margin-bottom:.75rem}
.lc-title{font-size:20px;font-weight:700;color:var(--text);margin-bottom:.4rem}
.lc-sub{font-size:13px;color:var(--text2);margin-bottom:1.5rem;line-height:1.6}
.lc-input{width:100%;padding:12px;border:2px solid var(--gray-bd);border-radius:var(--rsm);font-size:15px;font-family:inherit;color:var(--text);outline:none;transition:border-color .2s;margin-bottom:.75rem}
.lc-input:focus{border-color:var(--blue)}
.lc-btn{width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:var(--rsm);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.lc-btn:hover{opacity:.88}
.lc-err{font-size:12px;color:var(--red);margin-top:.5rem;min-height:18px}

/* 상단 */
.topbar{background:var(--card);border-bottom:1px solid var(--gray-bd);padding:.85rem 1.5rem;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10}
.tbl{font-size:22px}
.tb-title{font-size:16px;font-weight:700;color:var(--text);flex:1}
.tb-badge{background:var(--amber-lt);color:var(--amber);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:700}
.sync-btn{padding:7px 14px;border:1.5px solid var(--blue-bd);border-radius:var(--rsm);background:var(--blue-lt);color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;display:flex;align-items:center;gap:5px}
.sync-btn:hover{opacity:.85}

/* 탭 */
.tabs{background:var(--card);border-bottom:1px solid var(--gray-bd);display:flex;padding:0 1.5rem;gap:0}
.tab{padding:.75rem 1.25rem;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2.5px solid transparent;transition:all .15s}
.tab.active{color:var(--blue);border-bottom-color:var(--blue)}
.tab:hover:not(.active){color:var(--text)}

.content{padding:1.25rem 1.5rem;max-width:960px;margin:0 auto}
.page{display:none}
.page.show{display:block}

/* 카드 공통 */
.card{background:var(--card);border-radius:var(--radius);border:1px solid var(--gray-bd);padding:1.25rem 1.5rem;margin-bottom:1rem}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:1rem;display:flex;align-items:center;gap:6px}

/* 학생 설정 */
.stu-add-row{display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap}
.stu-add-row input,.stu-add-row select{padding:9px 12px;border:1.5px solid var(--gray-bd);border-radius:var(--rsm);font-size:13px;font-family:inherit;color:var(--text);background:var(--card);outline:none}
.stu-add-row input:focus,.stu-add-row select:focus{border-color:var(--blue)}
.level-btns{display:flex;gap:4px}
.lbtn{padding:8px 14px;border-radius:var(--rsm);font-size:13px;font-weight:700;cursor:pointer;border:1.5px solid var(--gray-bd);background:transparent;color:var(--text2);font-family:inherit;transition:all .15s}
.lbtn:hover{background:var(--gray-lt)}
.lbtn.lhi.on{background:#FEF2F2;color:#DC2626;border-color:#FECACA}
.lbtn.lmid.on{background:#FFFBEB;color:#D97706;border-color:#FDE68A}
.lbtn.llo.on{background:#F0FDF4;color:#16A34A;border-color:#BBF7D0}
.level-tag{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:700}
.lt-hi{background:#FEF2F2;color:#DC2626}
.lt-mid{background:#FFFBEB;color:#D97706}
.lt-lo{background:#F0FDF4;color:#16A34A}
.add-btn{padding:9px 18px;background:var(--blue);color:#fff;border:none;border-radius:var(--rsm);font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
.add-btn:hover{opacity:.88}
.stu-list{display:flex;flex-direction:column;gap:8px}
.stu-row{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--gray-lt);border-radius:var(--rsm);border:1px solid var(--gray-bd)}
.stu-name{font-size:14px;font-weight:700;color:var(--text);min-width:80px}
.stu-tags{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.stag{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:600;background:var(--blue-lt);color:var(--blue)}
.stu-edit{padding:5px 12px;border:1.5px solid var(--gray-bd);border-radius:var(--rsm);background:transparent;font-size:12px;color:var(--text2);cursor:pointer}
.stu-edit:hover{background:var(--gray-bd)}
.stu-del{padding:5px 10px;border:1.5px solid var(--red-bd);border-radius:var(--rsm);background:transparent;font-size:12px;color:var(--red);cursor:pointer}
.stu-del:hover{background:var(--red-lt)}
.domain-select{padding:5px 8px;border:1.5px solid var(--gray-bd);border-radius:var(--rsm);font-size:12px;font-family:inherit;background:var(--card);color:var(--text)}

/* 통계 */
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:1rem}
.sc{background:var(--card);border:1px solid var(--gray-bd);border-radius:var(--rsm);padding:1rem;text-align:center}
.sc-l{font-size:11px;color:var(--text3);margin-bottom:4px}
.sc-v{font-size:24px;font-weight:800;color:var(--text)}
.sc-s{font-size:11px;color:var(--text3);margin-top:2px}

/* 차트 */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:8px;padding-bottom:2px}
.bc-item{display:flex;flex-direction:column;align-items:center;flex:1;gap:3px}
.bc-bar{width:100%;border-radius:4px 4px 0 0;min-height:4px;background:var(--blue)}
.bc-lbl{font-size:9px;color:var(--text3);text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;width:100%}
.bc-val{font-size:9px;color:var(--text2)}

/* 도메인 정답률 */
.domain-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dc{background:var(--gray-lt);border-radius:var(--rsm);padding:.85rem 1rem}
.dc-name{font-size:12px;font-weight:700;color:var(--text);margin-bottom:5px}
.dc-bar-bg{height:6px;background:var(--gray-bd);border-radius:3px;overflow:hidden;margin-bottom:4px}
.dc-bar-fg{height:100%;border-radius:3px;background:var(--blue)}
.dc-pct{font-size:11px;color:var(--text2)}

/* 성적 테이블 */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:1rem;align-items:center}
.filter-row input,.filter-row select{padding:7px 10px;border:1.5px solid var(--gray-bd);border-radius:var(--rsm);font-size:12px;font-family:inherit;color:var(--text);background:var(--card);outline:none}
.filter-row input:focus,.filter-row select:focus{border-color:var(--blue)}
.csv-btn{margin-left:auto;padding:7px 13px;border:1.5px solid var(--gray-bd);border-radius:var(--rsm);background:transparent;font-size:12px;color:var(--text2);cursor:pointer}
.csv-btn:hover{background:var(--gray-lt)}
.rec-wrap{overflow-x:auto}
.rec-tbl{width:100%;border-collapse:collapse;font-size:12px}
.rec-tbl th{text-align:left;padding:8px 10px;color:var(--text2);border-bottom:1.5px solid var(--gray-bd);font-weight:600;font-size:11px;white-space:nowrap}
.rec-tbl td{padding:8px 10px;border-bottom:1px solid var(--gray-bd);color:var(--text);white-space:nowrap}
.rec-tbl tr:last-child td{border-bottom:none}
.rec-tbl tr:hover td{background:var(--gray-lt)}
.pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:700}
.pill-hi{background:var(--green-lt);color:var(--green)}
.pill-mid{background:var(--amber-lt);color:var(--amber)}
.pill-lo{background:var(--red-lt);color:var(--red)}
.del-btn{padding:3px 9px;border:1.5px solid var(--red-bd);border-radius:4px;background:transparent;font-size:11px;color:var(--red);cursor:pointer}
.del-btn:hover{background:var(--red-lt)}
.view-btn{padding:3px 9px;border:1.5px solid var(--blue-bd);border-radius:4px;background:transparent;font-size:11px;color:var(--blue);cursor:pointer}
.view-btn:hover{background:var(--blue-lt)}
.empty{text-align:center;padding:2.5rem;color:var(--text3);font-size:13px}

/* 학습지 모달 */
.modal-bg{position:fixed;inset:0;background:rgba(17,24,39,.6);display:none;align-items:flex-start;justify-content:center;z-index:200;overflow-y:auto;padding:2rem 1rem}
.modal-bg.show{display:flex}
.modal{background:var(--card);border-radius:16px;width:min(700px,96vw);padding:2rem;margin:auto}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
.modal-title{font-size:16px;font-weight:700;color:var(--text)}
.modal-close{padding:6px 14px;border:1.5px solid var(--gray-bd);border-radius:var(--rsm);background:transparent;font-size:13px;color:var(--text2);cursor:pointer}
.modal-close:hover{background:var(--gray-lt)}
.modal-meta{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.25rem}
.mm{background:var(--gray-lt);border-radius:var(--rsm);padding:.65rem .75rem;text-align:center}
.mm-l{font-size:10px;color:var(--text3);margin-bottom:2px}
.mm-v{font-size:15px;font-weight:700;color:var(--text)}
.quiz-print{display:flex;flex-direction:column;gap:10px}
.qrow{border:1px solid var(--gray-bd);border-radius:var(--rsm);overflow:hidden}
.qrow-head{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--gray-lt)}
.qrow-no{font-size:12px;font-weight:700;color:var(--text2);min-width:32px}
.qrow-q{font-size:14px;font-weight:600;color:var(--text);flex:1}
.qrow-badge{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:700}
.badge-ok{background:var(--green-lt);color:var(--green)}
.badge-ng{background:var(--red-lt);color:var(--red)}
.qrow-choices{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--gray-bd)}
.qc{padding:7px 14px;font-size:13px;display:flex;align-items:center;gap:8px;border-bottom:0.5px solid var(--gray-bd);border-right:0.5px solid var(--gray-bd)}
.qc:nth-child(even){border-right:none}
.qc:nth-last-child(-n+2){border-bottom:none}
.qc.ans-correct{background:var(--green-lt);color:var(--green)}
.qc.ans-wrong{background:var(--red-lt);color:var(--red)}
.qc.ans-right-not-chosen{background:var(--green-lt);color:var(--green);opacity:.6}
.cmark{font-size:14px;font-weight:700;min-width:16px}
.modal-print-btn{margin-top:1rem;width:100%;padding:10px;border:1.5px solid var(--blue-bd);border-radius:var(--rsm);background:var(--blue-lt);color:var(--blue);font-size:13px;font-weight:700;cursor:pointer}
.modal-print-btn:hover{opacity:.85}

/* 문제별 오답 분석 */
.wrong-list{display:flex;flex-direction:column;gap:6px}
.wrong-item{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--gray-lt);border-radius:var(--rsm)}
.wi-rank{min-width:24px;font-size:12px;font-weight:700;color:var(--text2)}
.wi-q{flex:1;font-size:13px;color:var(--text)}
.wi-cnt{font-size:12px;color:var(--red);font-weight:600}

/* 학생별 상세 */
.stu-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:1rem}
.sd-card{background:var(--gray-lt);border-radius:var(--rsm);padding:.85rem 1rem}
.sd-name{font-size:14px;font-weight:700;color:var(--text);margin-bottom:4px}
.sd-avg{font-size:22px;font-weight:800}
.sd-cnt{font-size:11px;color:var(--text3);margin-top:2px}
.sd-bar-bg{height:5px;background:var(--gray-bd);border-radius:3px;overflow:hidden;margin-top:6px}
.sd-bar-fg{height:100%;border-radius:3px}

/* 로딩 */
#loading{position:fixed;inset:0;background:rgba(255,255,255,.88);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;z-index:200}
#loading.show{display:flex}
.spin{width:36px;height:36px;border:3px solid var(--gray-bd);border-top-color:var(--blue);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.ld-msg{font-size:14px;color:var(--text2)}

/* 토스트 */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1F2937;color:#fff;padding:10px 20px;border-radius:var(--rsm);font-size:13px;display:none;z-index:300;white-space:nowrap}
.toast.show{display:block}

/* 설정 패널 */
.cfg-section{background:var(--blue-lt);border:1.5px solid var(--blue-bd);border-radius:var(--radius);padding:1.1rem 1.25rem;margin-bottom:1rem}
.cfg-title{font-size:13px;font-weight:700;color:var(--blue);margin-bottom:.6rem}
.cfg-fields{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.cfg-fields input{padding:8px 12px;border:1.5px solid var(--blue-bd);border-radius:var(--rsm);font-size:13px;font-family:inherit;color:var(--text);background:#fff;outline:none;width:160px}
.cfg-fields input:focus{border-color:var(--blue)}
.cfg-fields .save-cfg-btn{padding:8px 16px;background:var(--blue);color:#fff;border:none;border-radius:var(--rsm);font-size:13px;font-weight:700;cursor:pointer}

/* 반응형 */
@media(max-width:600px){
  .stats-grid{grid-template-columns:1fr 1fr}
  .domain-grid{grid-template-columns:1fr}
  .stu-detail-grid{grid-template-columns:1fr}
  .stu-add-row{flex-direction:column}
  .stu-add-row input,.stu-add-row select{width:100%}
}
</style>
</head>
<body>

<!-- 로그인 -->
<div id="loginOverlay">
  <div class="lc">
    <div class="lc-icon">🏫</div>
    <div class="lc-title">교사용 대시보드</div>
    <div class="lc-sub">담임 교사 비밀번호를 입력하세요.<br><small style="color:var(--text3)">첫 설정 시 원하는 비밀번호 입력 후 저장하면<br>자동 등록됩니다.</small></div>
    <input class="lc-input" id="pwInput" type="password" placeholder="비밀번호" onkeydown="if(event.key==='Enter')doLogin()"/>
    <button class="lc-btn" onclick="doLogin()">로그인</button>
    <div class="lc-err" id="loginErr"></div>
  </div>
</div>

<!-- 학습지 상세보기 모달 -->
<div class="modal-bg" id="quizModal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modalTitle">학습지 상세보기</div>
      <button class="modal-close" onclick="closeModal()">✕ 닫기</button>
    </div>
    <div class="modal-meta" id="modalMeta"></div>
    <div class="quiz-print" id="modalQuiz"></div>
    <button class="modal-print-btn" onclick="window.print()">🖨 인쇄하기</button>
  </div>
</div>

<!-- 로딩 -->
<div id="loading"><div class="spin"></div><div class="ld-msg" id="ldMsg">불러오는 중...</div></div>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<!-- 메인 -->
<div id="mainUI" style="display:none">
  <div class="topbar">
    <span class="tbl">🏫</span>
    <span class="tb-title">교사 대시보드 — 수학 연산 학습</span>
    <span class="tb-badge" id="lastSync">동기화 대기</span>
    <button class="sync-btn" onclick="syncAll()">↺ 새로고침</button>
  </div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab('students',this)">학생 설정</div>
    <div class="tab" onclick="switchTab('records',this)">성적 기록</div>
    <div class="tab" onclick="switchTab('stats',this)">분석 대시보드</div>
  </div>

  <div class="content">

    <!-- ① 학생 설정 탭 -->
    <div class="page show" id="page-students">
      <div class="card">
        <div class="card-title">➕ 학생 추가 / 설정</div>
        <div class="stu-add-row">
          <input id="addName" type="text" placeholder="학생 이름" style="width:120px" onkeydown="if(event.key==='Enter')addStudent()"/>
          <select id="addGrade">
            <option value="1">1학년</option><option value="2">2학년</option>
            <option value="3" selected>3학년</option><option value="4">4학년</option>
            <option value="5">5학년</option><option value="6">6학년</option>
          </select>
          <select id="addDomain">
            <option value="all">전 영역</option>
          </select>
          <div class="level-btns">
            <button class="lbtn lhi" id="lbtn-hi" onclick="setAddLevel('상',this)" title="상: 심화 문제">상</button>
            <button class="lbtn lmid on" id="lbtn-mid" onclick="setAddLevel('중',this)" title="중: 표준 문제">중</button>
            <button class="lbtn llo" id="lbtn-lo" onclick="setAddLevel('하',this)" title="하: 기초 문제">하</button>
          </div>
          <button class="add-btn" onclick="addStudent()">추가 / 저장</button>
        </div>
        <div id="studentList" class="stu-list"></div>
      </div>

    </div>

    <!-- ② 성적 기록 탭 -->
    <div class="page" id="page-records">
      <div class="card">
        <div class="card-title">📋 성적 기록</div>
        <div class="filter-row">
          <input type="text" id="fName" placeholder="이름 검색" oninput="renderRecords()"/>
          <input type="date" id="fDate" oninput="renderRecords()"/>
          <select id="fGrade" onchange="renderRecords()">
            <option value="">전체 학년</option>
            <option value="1학년">1학년</option><option value="2학년">2학년</option>
            <option value="3학년">3학년</option><option value="4학년">4학년</option>
            <option value="5학년">5학년</option><option value="6학년">6학년</option>
          </select>
          <select id="fDomain" onchange="renderRecords()"><option value="">전체 영역</option></select>
          <button class="csv-btn" onclick="exportCSV()">⬇ CSV 내보내기</button>
        </div>
        <div class="rec-wrap"><div id="recContainer"></div></div>
      </div>
    </div>

    <!-- ③ 분석 대시보드 탭 -->
    <div class="page" id="page-stats">
      <!-- 요약 통계 -->
      <div class="stats-grid" id="statsGrid"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:1rem">
        <div class="card" style="margin-bottom:0">
          <div class="card-title">📅 날짜별 평균 점수</div>
          <div class="bar-chart" id="dateChart"></div>
        </div>
        <div class="card" style="margin-bottom:0">
          <div class="card-title">📊 점수 분포</div>
          <div class="bar-chart" id="distChart"></div>
        </div>
      </div>

      <div class="card">
        <div class="card-title">🎯 영역별 정답률</div>
        <div class="domain-grid" id="domainStats"></div>
      </div>

      <div class="card">
        <div class="card-title">👤 학생별 평균 점수</div>
        <div class="stu-detail-grid" id="stuDetail"></div>
      </div>

      <div class="card">
        <div class="card-title">❌ 자주 틀린 문제 Top 10</div>
        <div class="wrong-list" id="wrongList"></div>
      </div>
    </div>

  </div><!-- /content -->
</div><!-- /mainUI -->

<script>
/* ════════════════════════════════════════════
   ★ JSONBin 설정 (localStorage에서 불러옴)
   ════════════════════════════════════════════ */
// Google Sheets 사용 — 별도 키 불필요

// JSONP 공통 함수
function jsonpRequest(url, timeout=10000){
  return new Promise((resolve, reject)=>{
    const cbName='_cb'+Date.now()+'_'+Math.random().toString(36).slice(2);
    const script=document.createElement('script');
    const t=setTimeout(()=>{
      cleanup();
      reject(new Error('timeout'));
    }, timeout);
    function cleanup(){
      try{delete window[cbName];}catch(e){}
      try{script.remove();}catch(e){}
      clearTimeout(t);
    }
    window[cbName]=(data)=>{
      cleanup();
      resolve(data);
    };
    script.src=url+(url.includes('?')?'&':'?')+'callback='+cbName;
    script.onerror=()=>{cleanup();reject(new Error('script error'));};
    document.head.appendChild(script);
  });
}

async function binGet(id){
  const url=id==='settings'?SETTINGS_URL:RECORDS_URL;
  function unwrap(obj){return(obj&&obj.students!==undefined)?obj:(obj&&obj.data?unwrap(obj.data):obj);}
  try{
    let data=await jsonpRequest(url);
    if(id==='settings')data=unwrap(data)||{students:{},pw:''};
    try{localStorage.setItem('mathCache_'+id,JSON.stringify(data));}catch(e){}
    return data;
  }catch(e){
    try{
      const cached=localStorage.getItem('mathCache_'+id);
      if(cached){
        let d=JSON.parse(cached);
        if(id==='settings')d=unwrap(d)||{students:{},pw:''};
        return d;
      }
    }catch(e2){}
    throw new Error('연결 실패: '+e.message);
  }
}
async function binPut(id,data){
  const url=id==='settings'?SETTINGS_URL:RECORDS_URL;
  try{localStorage.setItem('mathCache_'+id,JSON.stringify(data));}catch(e){}
  try{
          await fetch(url,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({id,data})});
  }catch(e){
    console.warn('서버 저장 실패(로컬엔 저장됨):', e.message);
  }
  return {status:'ok'};
}

async function syncAll(){
  
  showLoad('데이터 동기화 중...');
  try{
    const [s,r]=await Promise.all([binGet('settings'),binGet('records')]);
    // 서버 데이터와 로컬 캐시 병합 (학생 수가 더 많은 쪽 우선)
    const serverStudents=s?.students||{};
    let localSettings={students:{},pw:''};
    try{const lc=localStorage.getItem('mathCache_settings');if(lc)localSettings=JSON.parse(lc);}catch(e){}
    const localStudents=localSettings.students||{};
    const serverCount=Object.keys(serverStudents).length;
    const localCount=Object.keys(localStudents).length;
    if(serverCount>=localCount){
      settings=s||{students:{},pw:''};
    } else {
      // 로컬이 더 많으면 로컬 우선, 서버에 다시 저장
      settings=localSettings;
      settings.pw=s?.pw||localSettings.pw;
      await binPut('settings',settings);
    }
    records=Array.isArray(r?.records)?r.records:[];
    // 로컬 캐시 갱신
    try{localStorage.setItem('mathCache_settings',JSON.stringify(settings));}catch(e){}
        try{localStorage.setItem('mathCache_records',JSON.stringify({records}));}catch(e){}
    hideLoad();
    document.getElementById('lastSync').textContent=`동기화: ${new Date().toLocaleTimeString('ko-KR')}`;
    renderAll();
    showToast('✅ 동기화 완료');
  }catch(e){
    hideLoad();showToast('❌ 서버 연결 실패: '+e.message);
    // 서버 실패 시 로컬 캐시로 복구
    try{
      const lc=localStorage.getItem('mathCache_settings');
      if(lc){settings=JSON.parse(lc);renderAll();}
    }catch(e2){}
  }
}

function renderRecords(){
  const nf=(document.getElementById('fName')?.value||'').trim().toLowerCase();
  const df=document.getElementById('fDate')?.value||'';
  const gf=document.getElementById('fGrade')?.value||'';
  const domf=document.getElementById('fDomain')?.value||'';
  const filtered=[...records].filter(r=>
    (!nf||r.name.toLowerCase().includes(nf))&&
    (!df||r.date===df)&&(!gf||r.grade===gf)&&(!domf||r.domain===domf)
  ).reverse();
  const con=document.getElementById('recContainer');
  if(!filtered.length){con.innerHTML='<div class="empty">성적 기록이 없습니다.</div>';return}
  // 원본 records에서 실제 인덱스 계산을 위해 filtered에 원본 idx 붙이기
  const withIdx=filtered.map(r=>{const oi=records.indexOf(r);return{r,oi}});
  con.innerHTML=`<table class="rec-tbl">
    <thead><tr>
      <th>날짜</th><th>시간</th><th>이름</th><th>학년</th><th>영역</th><th>점수</th><th>정답</th><th></th>
    </tr></thead>
    <tbody>${withIdx.map(({r,oi},i)=>{
      const cls=r.pct>=80?'pill-hi':r.pct>=60?'pill-mid':'pill-lo';
      const hasDetails=r.details&&r.details.length>0;
      return`<tr>
        <td>${r.date}</td><td>${r.time||''}</td><td><b>${r.name}</b></td>
        <td>${r.grade}</td><td>${r.domain}</td>
        <td><span class="pill ${cls}">${r.pct}점</span></td>
        <td>${r.correct}/${r.total}</td>
        <td style="display:flex;gap:4px">
          ${hasDetails?`<button class="view-btn" onclick="openModal(${oi})">학습지</button>`:''}
          <button class="del-btn" onclick="deleteRecord(${oi})">삭제</button>
        </td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

function openModal(idx){
  const r=records[idx];
  if(!r)return;
  const cls=r.pct>=80?'pill-hi':r.pct>=60?'pill-mid':'pill-lo';
  document.getElementById('modalTitle').textContent=`📄 ${r.name} 학습지 — ${r.date}`;
  document.getElementById('modalMeta').innerHTML=`
    <div class="mm"><div class="mm-l">이름</div><div class="mm-v">${r.name}</div></div>
    <div class="mm"><div class="mm-l">학년·영역</div><div class="mm-v" style="font-size:12px">${r.grade} ${r.domain}</div></div>
    <div class="mm"><div class="mm-l">점수</div><div class="mm-v"><span class="pill ${cls}">${r.pct}점</span></div></div>
    <div class="mm"><div class="mm-l">정답/전체</div><div class="mm-v">${r.correct}/${r.total}</div></div>`;
  const nums=['①','②','③','④'];
  const details=r.details||[];
  document.getElementById('modalQuiz').innerHTML=details.map((d,i)=>{
    const ok=d.ok;
    return`<div class="qrow">
      <div class="qrow-head">
        <span class="qrow-no">${i+1}번</span>
        <span class="qrow-q">${d.q}</span>
        <span class="qrow-badge ${ok?'badge-ok':'badge-ng'}">${ok?'✓ 정답':'✗ 오답'}</span>
      </div>
      ${d.choices?`<div class="qrow-choices">${d.choices.map((c,ci)=>{
        let cls2='qc';
        const isAns=c===d.ans;
        const isChosen=c===d.chosen;
        if(isChosen&&ok)cls2+=' ans-correct';
        else if(isChosen&&!ok)cls2+=' ans-wrong';
        else if(isAns&&!ok)cls2+=' ans-right-not-chosen';
        const mark=isChosen?(ok?'✓':'✗'):(isAns&&!ok?'→':'');
        return`<div class="${cls2}"><span class="cmark">${mark||nums[ci]}</span>${c}</div>`;
      }).join('')}</div>`
      :`<div style="padding:8px 14px;font-size:13px;color:var(--text2)">정답: <b style="color:var(--green)">${d.ans}</b>&nbsp;&nbsp;학생 답: <b style="color:${ok?'var(--green)':'var(--red)'}">${d.chosen||'-'}</b></div>`}
    </div>`;
  }).join('');
  document.getElementById('quizModal').classList.add('show');
}

function closeModal(){
  document.getElementById('quizModal').classList.remove('show');
}

async function deleteRecord(idx){

  records.splice(idx,1);

function renderStats(){
  if(!records.length){
    document.getElementById('statsGrid').innerHTML='<div style="grid-column:1/-1" class="empty">기록이 없습니다.</div>';
    document.getElementById('dateChart').innerHTML='';
    document.getElementById('distChart').innerHTML='';
    document.getElementById('domainStats').innerHTML='';
    document.getElementById('stuDetail').innerHTML='';
    document.getElementById('wrongList').innerHTML='';
    return;
  }
  const total=records.length;
  const avg=Math.round(records.reduce((s,r)=>s+r.pct,0)/total);
  const names=[...new Set(records.map(r=>r.name))].length;
  const hi=Math.max(...records.map(r=>r.pct));
  document.getElementById('statsGrid').innerHTML=`
    <div class="sc"><div class="sc-l">총 응시</div><div class="sc-v">${total}<span style="font-size:14px">회</span></div></div>
    <div class="sc"><div class="sc-l">전체 평균</div><div class="sc-v">${avg}<span style="font-size:14px">점</span></div></div>
    <div class="sc"><div class="sc-l">참여 학생</div><div class="sc-v">${names}<span style="font-size:14px">명</span></div></div>
    <div class="sc"><div class="sc-l">최고 점수</div><div class="sc-v">${hi}<span style="font-size:14px">점</span></div></div>`;
  renderDateChart();renderDistChart();renderDomainStats();renderStuDetail();renderWrongList();
}

function renderDateChart(){
  const byDate={};
  records.forEach(r=>{if(!byDate[r.date])byDate[r.date]={s:0,n:0};byDate[r.date].s+=r.pct;byDate[r.date].n++});
  const dates=Object.keys(byDate).sort().slice(-12);
  const mx=Math.max(...dates.map(d=>Math.round(byDate[d].s/byDate[d].n)),1);
  document.getElementById('dateChart').innerHTML=dates.map(d=>{
    const avg=Math.round(byDate[d].s/byDate[d].n);
    const h=Math.max(4,Math.round(avg/mx*100));
    return`<div class="bc-item"><div class="bc-val">${avg}</div><div class="bc-bar" style="height:${h}px"></div><div class="bc-lbl">${d.slice(5)}</div></div>`;
  }).join('');
}

function renderDistChart(){
  const bins=[0,0,0,0,0];
  records.forEach(r=>{bins[Math.min(4,Math.floor(r.pct/20))]++});
  const lbls=['0-19','20-39','40-59','60-79','80-100'];
  const mx=Math.max(...bins,1);
  document.getElementById('distChart').innerHTML=bins.map((v,i)=>{
    const h=Math.max(4,Math.round(v/mx*100));
    const colors=['#DC2626','#EF4444','#F59E0B','#3B82F6','#16A34A'];
    return`<div class="bc-item"><div class="bc-val">${v}</div><div class="bc-bar" style="height:${h}px;background:${colors[i]}"></div><div class="bc-lbl">${lbls[i]}</div></div>`;
  }).join('');
}

function renderDomainStats(){
  const byDom={};
  records.forEach(r=>{if(!byDom[r.domain])byDom[r.domain]={s:0,n:0};byDom[r.domain].s+=r.pct;byDom[r.domain].n++});
  document.getElementById('domainStats').innerHTML=Object.entries(byDom).map(([d,{s,n}])=>{
    const avg=Math.round(s/n);
    return`<div class="dc"><div class="dc-name">${d}</div>
      <div class="dc-bar-bg"><div class="dc-bar-fg" style="width:${avg}%"></div></div>
      <div class="dc-pct">${avg}점 (${n}회)</div></div>`;
  }).join('');
}

function renderStuDetail(){
  const byStu={};
  records.forEach(r=>{if(!byStu[r.name])byStu[r.name]={s:0,n:0};byStu[r.name].s+=r.pct;byStu[r.name].n++});
  document.getElementById('stuDetail').innerHTML=Object.entries(byStu)
    .sort((a,b)=>b[1].s/b[1].n-a[1].s/a[1].n)
    .map(([name,{s,n}])=>{
      const avg=Math.round(s/n);
      const color=avg>=80?'#16A34A':avg>=60?'#D97706':'#DC2626';
      return`<div class="sd-card">
        <div class="sd-name">${name}</div>
        <div class="sd-avg" style="color:${color}">${avg}<span style="font-size:13px;font-weight:400;color:var(--text2)">점</span></div>
        <div class="sd-cnt">${n}회 응시</div>
        <div class="sd-bar-bg"><div class="sd-bar-fg" style="width:${avg}%;background:${color}"></div></div>
      </div>`;
    }).join('');
}

function renderWrongList(){
  const wrongMap={};
  records.forEach(r=>{
    (r.details||[]).forEach(d=>{
      if(!d.ok){if(!wrongMap[d.q])wrongMap[d.q]=0;wrongMap[d.q]++}
    });
  });
  const sorted=Object.entries(wrongMap).sort((a,b)=>b[1]-a[1]).slice(0,10);
  if(!sorted.length){document.getElementById('wrongList').innerHTML='<div class="empty">오답 데이터가 없습니다.</div>';return}
  document.getElementById('wrongList').innerHTML=sorted.map(([q,cnt],i)=>
    `<div class="wrong-item">
      <span class="wi-rank">${i+1}위</span>
      <span class="wi-q">${q}</span>
      <span class="wi-cnt">오답 ${cnt}회</span>
    </div>`).join('');
}

/* ════════════════
   탭 전환
   ════════════════ */
function switchTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('show'));
  document.getElementById('page-'+tab).classList.add('show');
  if(tab==='stats')renderStats();
  if(tab==='records'){renderRecords();updateDomainFilter()}
}

/* ════════════════
   유틸
   ════════════════ */
function showLoad(msg){document.getElementById('ldMsg').textContent=msg||'';document.getElementById('loading').classList.add('show')}
function hideLoad(){document.getElementById('loading').classList.remove('show')}
let toastTimer;
function showToast(msg){
  const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);
}

/* 초기화 */
</script>
